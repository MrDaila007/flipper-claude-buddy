name: CI

on:
  push:
    branches: [main, tests]
  pull_request:
    branches: [main, tests]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flipper-app:
    name: Flipper app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: pip install ufbt

      - name: Build FAP
        run: cd flipper-app && ufbt build

      - name: Run protocol C tests
        run: cd flipper-app/tests && make test

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude_buddy-fap
          path: ~/.ufbt/build/claude_buddy.fap
          if-no-files-found: error

  claude-host-bridge:
    name: Claude host bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pyserial pyserial-asyncio bleak

      - name: Run tests
        working-directory: plugin/host-bridge
        env:
          PYTHONPATH: .
        run: pytest -q

  codex-host-bridge:
    name: Codex host bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pyserial pyserial-asyncio bleak

      - name: Run tests
        working-directory: flipper-codex-buddy/host-bridge
        env:
          PYTHONPATH: .
        run: pytest -q

  codex-plugin:
    name: Codex plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate plugin manifest and hooks
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("flipper-codex-buddy")
          manifest = json.loads((root / ".codex-plugin" / "plugin.json").read_text(encoding="utf-8"))
          hooks = json.loads((root / "hooks" / "hooks.json").read_text(encoding="utf-8"))
          marketplace = json.loads(Path(".agents/plugins/marketplace.json").read_text(encoding="utf-8"))

          assert manifest["name"] == "flipper-codex-buddy"
          for key in ("name", "version", "description", "interface"):
              assert key in manifest, key

          assert "hooks" in hooks
          assert any(
              hook_entry.get("hooks")
              for entries in hooks["hooks"].values()
              for hook_entry in entries
          )

          plugin_names = [entry["name"] for entry in marketplace["plugins"]]
          assert "flipper-codex-buddy" in plugin_names
          print("Codex plugin validation passed")
          PY

      - name: Check install and bridge scripts are executable
        run: |
          test -x flipper-codex-buddy/scripts/install-codex-plugin.sh
          test -x flipper-codex-buddy/bin/flipper-bridge
